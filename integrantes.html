<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integrantes del Equipo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .grid-integrantes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      margin-top: 30px;
      text-align: center;
    }
    .tarjeta-integrante img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
      border: 3px solid #1a56db;
    }
  </style>
</head>
<body>

  <header class="header-institucional">
    <div class="logo-box">
      <img src="imagenes/logo-tecnm.png" alt="TecNM" class="logo-header">
      <img src="imagenes/logo-sep.png" alt="SEP" class="logo-header">
    </div>
    <h1 class="titulo-principal">EQUIPO DE TRABAJO</h1>
    <div class="header-right">
      <a href="index.html" class="nav-link">Inicio</a>
      <img src="imagenes/logo-instituto.png" alt="Logo Escuela" class="logo-header">
    </div>
  </header>

  <main class="contenedor-principal">
    <div class="grid-integrantes">
      <div class="tarjeta-integrante">
        <img src="imagenes/integrante1.jpg">
        <h3>Aryana Calderón Sánchez</h3>
        <p>Número de Control: 23070967</p>
      </div>
      <div class="tarjeta-integrante">
        <img src="imagenes/integrante2.jpg">
        <h3>Nombre Completo 2</h3>
        <p>Rol / Número de Control</p>
      </div>
      <div class="tarjeta-integrante">
        <img src="imagenes/integrante2.jpg">
        <h3>Nombre Completo 3</h3>
        <p>Rol / Número de Control</p>
      </div>
      <div class="tarjeta-integrante">
        <img src="imagenes/integrante2.jpg" >
        <h3>Nombre Completo 4</h3>
        <p>Rol / Número de Control</p>
      </div>
      <div class="tarjeta-integrante">
        <img src="imagenes/integrante2.jpg">
        <h3>Nombre Completo 5</h3>
        <p>Rol / Número de Control</p>
      </div>
    </div>
  </main>

</body>
</html>
